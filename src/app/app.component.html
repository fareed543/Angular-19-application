<h1 style="text-align:center;">Fake Store Products</h1>

<!-- only ONE grid container -->
  <button (click)="toggleView()">
    Switch to {{ isGridView ? 'Flex' : 'Grid' }} View
  </button>
  
<!-- GRID VIEW -->
<div [ngClass]="isGridView ? 'products-grid' : 'products-flex'">
  <app-product 
    *ngFor="let product of productList" 
    [product]="product">
  </app-product>
</div>
