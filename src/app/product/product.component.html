<div class="card">
    <img [src]="product.image" [alt]="product.title" class="card-img">
    <div class="card-body">
        <h3>{{ product.title }} {{product.id}}</h3>
        <p class="category">{{ product.category }}</p>
        <p class="price">$ {{ product.price }}</p>
        <p class="desc">{{ product.description | slice:0:80 }}...</p>
        <small>Rating {{ product.rating.rate }} ({{ product.rating.count }} reviews)</small>
    </div>
</div>
